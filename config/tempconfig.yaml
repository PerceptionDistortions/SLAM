system:
  #SLAM TYPES
  #mono, mono_vi, stereo_vi
  type: mono

  #SENSORS USED
  #cam0,cam1,cam2...
  #imu0, imu1...
  #false
  mono_camera: cam0

  monovi_camera: cam0
  monovi_imu: imu0

  stereovi_leftcamera: cam0
  stereovi_rightcamera: cam1
  stereovi_imu: imu0

  #VISUALIZER
  visualizer: pangolin

visual_frontend:
  #PREPROCESSING
  motion_blur: laplacian

  light_exposure: clahe

  #orb, superpoint
  detector_descriptor: orb

  #ORB params
  orb_feature_count: 2000
  orb_scale_factor: 1.2
  orb_levels: 8

  #bf, none
  feature_matcher: bf

  #hamming, manhattan
  bf_norm: hamming

  #optical flow, none
  feature_tracker: none

  #descriptor matching and filtering
  lowe_ratio: 0.7
  cross_check: mutual_best
  distance_filtering: fixed_distance
  
  #RANSAC
  recover_pose_distance_threshold: 1e6
  minimum_landmark_pnp: 6

  #PnP RANSAC
  pnp_iterations_count: 100;
  pnp_reprojection_threshold: 3.0
  pnp_confidence: 0.99
  pnp_min_correspondence: 6
  pnp_refine_with_inliers: true

  #TRACK MANAGEMENT
  track_maximum_observation: 30
  tentative_track_max_misses: 3
  tentative_track_max_age: 5
  active_track_max_misses: 3

  #MOTION GATING

  #POSE ONLY REFINEMENT
  pose_only_refinement: ceres
  pose_only_refine_correspondence: 20

  #POSE ONLY: CONFIG
  ceres_por_max_iterations: 15
  ceres_por_max_time_seconds: 0.05
  ceres_por_use_robust_loss: true
  ceres_por_huber_loss_scale: 3.0
  ceres_por_function_tolerance: 1.0e-8
  ceres_por_gradient_tolerance: 1.0e-10
  ceres_por_parameter_tolerance: 1.0e-8
  ceres_por_linear_solver: "dense_qr"
  
  #TRIANGULATION
  triangulator: mid_point

logging:

  buffers: false
  visual_frontend: false
  estimator: false
  maps: false
  visualization: false


