slam_system:
  type: mono #mono,mono_vi,stereo_vi,multiview_vi
  
  #monocular slam sensor id used
  mono_cam_id: cam0
  
  #mono_vi sensor id used
  mono_vi_cam_id: cam0
  mono_vi_imu_id: imu0

  #stereo_vi sensor id used
  stereo_vi_left_cam_id: cam0
  stereo_vi_right_cam_id: cam1
  stereo_vi_imu_id: imu0

  controlled_playback: true #PRESS KEY P TO START THE NEXT ITERATION

  #multiview_vi sensor id used: TODO

  visualizer: pangolin

sensor_data_source:
  type: dataset #physical, dataset

  #DATASET
  dataset_id: euroc
  dataset_path: "datasets/euroc"
  playback_rate: 1.0

sensors:
  #CAM 0 EUROC
  - id: cam0
    type: camera
    source_id: euroc
    driver: euroc
    config:
      stream: cam0
      data_path: "mav0/cam0/data"
      csv: "mav0/cam0/data.csv"
      calibration:
        type: loader
        name: euroc_yaml
        file: "mav0/cam0/sensor.yaml"

  #CAM 1 EUROC
  - id: cam1
    type: camera
    source_id: euroc
    driver: euroc
    config:
      stream: cam1
      data_path: "mav0/cam1/data"
      csv: "mav0/cam1/data.csv"
      calibration:
        type: loader
        name: euroc_yaml
        file: "mav0/cam1/sensor.yaml"

  #IMU: EUROC
  - id: imu0
    type: imu
    source_id: euroc
    driver: euroc
    config:
      stream: imu0
      csv: "mav0/imu0/data.csv"
      calibration:
        type: loader
        name: euroc_yaml
        file: "mav0/imu0/sensor.yaml"

visual_frontend:
  #PREPROCESS
  motion_blur: laplacian
  light_exposure: clahe

  #clahe params
  clahe_cliplimit: 2.0
  clahe_tile_grid_size: 8 

  #LAPLACIAN
  laplacian_variance_threshold: 100.0

  #FEATURE DETECTION AND MATCHING
  detection_description: orb
  feature_matching: bf
  feature_tracking: none #optical flow

  #ORB PARAMS
  orb_feature_count: 2000
  orb_scale_factor: 1.2
  orb_levels: 8

  #DESCRIPTOR MATCHING AND FILTERING
  lowe_ratio: 0.7
  cross_check: mutual_best
  distance_filtering: fixed_distance

  #FIXED DISTANCE CHECKER
  fixed_distance_filter_max_distance: 60

  #RANSAC
  recover_pose_distance_threshold: 1e6

  #MOTION GATING
  e_ransac_match_count: 30
  pnp_ransac_count: 5

track_management:
  tentative_age: 20
  tentative_max_miss: 3
  tentative_max_match: 2
  
  active_age: 20
  active_max_miss: 3
  active_max_match: 2

  triangulated_max_observations: 20
  triangulated_max_matches: 2
  triangultaed_max_miss: 3
  triangulated_max_correspondece_mismatch: 1
  
  triangulated_lost_max_miss: 5
  triangulated_lost_max_match: 2

  landmark_max_observations: 20
  landmark_max_miss: 3

  landmark_lost_max_miss: 5
  landmark_lost_max_match: 3

pnp:
  pnp_strategy: epnp
  minimum_landmark_pnp: 20

  #pnp configuration
  pnp_iterations_count: 100
  pnp_reprojection_threshold: 3.0
  pnp_confidence: 0.99
  pnp_min_correspondence: 6
  pnp_refine_with_inliers: true

triangulation:
  triangulator: mid_point

  #MID POINT CONFIG
  midpoint_min_parallax_degree: 1.0
  midpoint_min_baseline: 1e-6
  midpoint_maxprojection_error_pixels: 3.0
  midpoint_max_ray_separation: 0.0
  midpoint_mindepth: 1e-6
  midpoint_geometry_epsilon: 1e-10
  midpoint_fraction_keyframe: 0.3

#ESTIMATOR, PREDICTOR, CORRECTOR WILL BE HARD BOUND WITH SLAM TYPE
estimation:
  #COVARIANCE SD
  position_sd: 0.0
  velocity_sd: 0.5
  orientation_sd: 0.0
  acc_bias_sd: 0.0
  gyro_bias_sd: 0.0

logging:
  sensors: false
  visual_frontend: false
  estimation: false
  visualization: false
  map: false


