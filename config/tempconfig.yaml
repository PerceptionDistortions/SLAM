slam_system:
  type: monocular #mono,mono_vi,stereo_vi,multiview_vi
  
  #monocular slam sensor id used
  mono_cam_id: cam0
  
  #mono_vi sensor id used
  mono_vi_cam_id: cam0
  mono_vi_imu_id: imu0

  #stereo_vi sensor id used
  stereo_vi_left_cam_id: cam0
  stereo_vi_right_cam_id: cam1
  stereo_vi_imu_id: imu0

  #multiview_vi sensor id used: TODO

  visualizer: pangolin

visual_frontend:
  #PREPROCESS
  motion_blur: laplacian
  light_exposure: clahe

  #FEATURE DETECTION AND MATCHING
  detection_description: orb
  feature_matching: bf
  feature_tracking: none #optical flow

  #ORB PARAMS
  orb_feature_count: 2000
  orb_scale_factor: 1.2
  orb_levels: 8

  #DESCRIPTOR MATCHING AND FILTERING
  lowe_ratio: 0.7
  cross_check: mutual_best
  distance_filtering: fixed_distance

  #RANSAC
  recover_pose_distance_threshold: 1e6

  #MOTION GATING
  e_ransac_match_count: 30
  pnp_ransac_count: 5

track_management:
  tentative_age: 20
  tentative_max_miss: 2
  tentative_max_match: 2
  
  active_age: 20
  active_max_miss: 2
  active_max_match: 2

  triangulated_max_observations: 20
  triangulated_max_matches: 2
  triangultaed_max_miss: 3
  
  triangulated_lost_max_miss: 5
  triangulated_lost_max_match: 2

  landmark_max_observations: 20
  landmark_max_miss: 3

  landmark_lost_max_miss: 5
  landmark_lost_max_match: 3

pnp:
  minimum_landmark_pnp: 20

  #pnp configuration
  pnp_iterations_count: 100;
  pnp_reprojection_threshold: 3.0
  pnp_confidence: 0.99
  pnp_min_correspondence: 6
  pnp_refine_with_inliers: true

triangulation:
  triangulator: mid_point

logging:
  sensors: false
  visual_frontend: false
  estimation: false
  visualization: false
  map: false




























visual_frontend_core:

  
  #DETECTION AND DESCRIPTION
  
  #FEATURE MATCHING
  feature_matcher: bf

  #BF MATCHING DISTANCE
  bf_norm: hamming
  
  
  

  

visual_frontend_track_management:

 

  #POSE ONLY REFINEMENT
  pose_only_refinement: ceres
  pose_only_refine_correspondence: 20

  #POSE ONLY: CONFIG
  ceres_por_max_iterations: 15
  ceres_por_max_time_seconds: 0.05
  ceres_por_use_robust_loss: true
  ceres_por_huber_loss_scale: 3.0
  ceres_por_function_tolerance: 1.0e-8
  ceres_por_gradient_tolerance: 1.0e-10
  ceres_por_parameter_tolerance: 1.0e-8
  ceres_por_linear_solver: "dense_qr"
  



